name: Weekly Model Retraining

on:
  schedule:
    - cron: "0 0 * * 1"   # Setiap hari Senin jam 07:00 WIB (00:00 UTC)
  workflow_dispatch:   # trigger manual buat testing

permissions:
  contents: write   # dipakai step "Commit latest results" buat push balik hasil terbaru ke repo

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Jaga-jaga: HDBSCAN/UMAP kadang butuh compile dari source kalau wheel
      # prebuilt gak tersedia buat kombinasi Python/OS runner ini. Gak
      # ngerugiin kalau ternyata gak kepake (apt-get install idempotent & cepat).
      - name: Install build tools (safety net buat HDBSCAN/UMAP native deps)
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install dependencies
        run: pip install -r retraining/requirements.txt

      # CATATAN: sengaja TIDAK set PYTHONIOENCODING=utf-8 di sini. Itu cuma
      # perlu buat run manual di Windows lokal (MLflow print emoji ke stdout,
      # gak kebaca default codepage cp1252 Windows). Runner Ubuntu ini
      # defaultnya udah UTF-8, jadi baris itu gak relevan -- jangan ditambahin
      # lagi tanpa alasan baru.
      - name: Run retrain_model.py
        working-directory: retraining
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python retrain_model.py

      - name: Commit latest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add retraining/latest_results/
          git diff --staged --quiet || git commit -m "Update latest topic assignments ($(date +%F))"
          git push

      - name: Retrain selesai
        run: echo "Retrain mingguan sukses -- model baru ke-register di MLflow Model Registry."

      # CATATAN: retrain_model.py SENGAJA tidak auto-promote model baru ke
      # stage Production (keputusan desain -- lihat docstring retrain_model.py).
      # Jadi gak ada step "promote otomatis" di sini. Setelah workflow ini
      # selesai, review dulu metrik run barunya di MLflow UI, baru kalau oke
      # jalankan retraining/promote_version.py manual dari laptop.
